<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>MapLibre GL JS ベクトル地図サンプル</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">

    <link href='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css' rel='stylesheet' />
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        #map {
            width: 100vw;
            height: 100vh;
        }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script type='module'>
      import * as maplibregl from 'https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.mjs';

      const map = new maplibregl.Map({
        container: 'map',
        style: 'https://raw.githubusercontent.com/gsi-cyberjapan/gsivectortile-mapbox-gl-js/refs/heads/master/std.json',
        center: [139.7671, 35.6812], // 中心位置を追加 (東京駅)
		    zoom: 9 // 初期ズームレベルを指定
      });
      map.addControl(new maplibregl.NavigationControl(), 'top-right');
    </script>
  </body>
</html>
